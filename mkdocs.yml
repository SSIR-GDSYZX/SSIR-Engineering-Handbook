site_name: SSIR Engineering Handbook
site_description: Robotics and Engineering Knowledge Base
repo_url: https://github.com/SSIR-GDSYZX/SSIR-Engineering-Handbook
edit_uri: edit/main/docs/
site_url: https://ssir-gdsyzx.github.io/SSIR-Engineering-Handbook/
docs_dir: docs
site_dir: site
exclude_docs: "!/templates/"
extra_css:
  - static/stylesheets/homepage.css
  - static/stylesheets/documentation.css
  - static/stylesheets/typography.css

theme:
  name: material
  custom_dir: overrides
  language: zh
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: 切换到深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: 切换到浅色模式
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

plugins:
  - search:
      lang: zh
  - awesome-pages:
      filename: _nav.md
      collapse_single_pages: false
      strict: false

markdown_extensions:
  - admonition
  - tables
  - fenced_code
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_div_format
  - pymdownx.arithmatex:
      generic: true

extra_javascript:
  - static/javascripts/mathjax-loader.js
  - static/javascripts/mermaid-init.js

nav:
  - 首页: index.md
  - 关于: about/index.md
  - 学院:
      - academy/index.md
      - 开发环境: academy/development-environment/index.md
      - 机械设计: academy/mechanical-design/index.md
      - 电子技术: academy/electronics/index.md
      - 制造工艺: academy/manufacturing/index.md
      - 机器人:
          - academy/robotics/index.md
          - 第一次社课：Boids 群体行为模拟: academy/robotics/boids.md
  - 项目:
      - projects/index.md
      - 进行中: projects/active/index.md
      - 已归档: projects/archive/index.md
  - 工坊:
      - workshop/index.md
      - 3D 打印:
          - workshop/3d-printing/index.md
          - Bambu Lab A1 设备概览: workshop/3d-printing/bambu-lab-a1.md
          - 日常操作: workshop/3d-printing/daily-operation.md
          - 维护指南: workshop/3d-printing/maintenance.md
          - 故障排查: workshop/3d-printing/troubleshooting.md
      - 激光切割: workshop/laser-cutting/index.md
      - 制造: workshop/manufacturing/index.md
  - 资产:
      - assets/index.md
      - 设备: assets/equipment/index.md
      - 耗材:
          - assets/consumables/index.md
          - 3D 打印材料:
              - assets/consumables/3d-printing/index.md
              - PLA: assets/consumables/3d-printing/pla.md
              - PETG: assets/consumables/3d-printing/petg.md
              - PETG HF: assets/consumables/3d-printing/petg-hf.md
              - 耗材储存与烘干: assets/consumables/3d-printing/storage-and-drying.md
              - 打印配置文件下载: assets/consumables/3d-printing/profiles/index.md
      - 模板: assets/templates/index.md
  - 技术:
      - technology/index.md
      - 机器人: technology/robotics/index.md
      - 机械: technology/mechanical/index.md
      - 电子: technology/electronics/index.md
      - 嵌入式: technology/embedded/index.md
      - 控制: technology/control/index.md
      - 人工智能: technology/artificial-intelligence/index.md
  - 研究: research/index.md
  - 安全: safety/index.md
  - 组织:
      - organization/index.md
      - 网站使用指南: organization/website-guide.md
      - 文档编辑与贡献: organization/document-editing-guide.md
      - 贡献指南: organization/contribution-guide.md
      - 文档规范: organization/document-standards.md
      - 页面视觉与图片规范: organization/documentation-visual-system.md
      - 字体与性能审计: organization/typography-and-performance.md
      - 模板:
          - templates/index.md
          - 软件安装教程: templates/tutorial-template.md
          - 项目对齐表: templates/project-template.md
          - 设备档案: templates/equipment-template.md
          - 设备维护记录: templates/maintenance-template.md
          - 技术实验报告: templates/experiment-template.md
